name: pages

# Builds the WCLAP package and publishes it with a download page on GitHub
# Pages. Requires Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Initialize pinned submodules
        run: git submodule update --init vendor/obxd vendor/clap

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Install pinned wasi-sdk
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux.tar.gz"
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz"
          curl -L --fail --retry 3 "$url" -o "$archive"
          cmake \
            -DLOCK="$GITHUB_WORKSPACE/toolchains/wasi-sdk.lock" \
            -DARCHIVE="$archive" \
            -P "$GITHUB_WORKSPACE/cmake/VerifyWasiSdk.cmake"
          tar -C "$RUNNER_TEMP" -xf "$archive"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"

      - name: Build WCLAP package
        run: |
          cmake -S . -B build-wasi -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$WASI_SDK_PATH/share/cmake/wasi-sdk-p1.cmake" \
            -DWASI_SDK_PATH="$WASI_SDK_PATH" -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasi --target package_wclap --parallel 2
          cat dist/OB-Xd.wclap.sha256

      - name: Verify WCLAP contract
        run: ctest --test-dir build-wasi --output-on-failure

      - name: Assemble download site
        run: node scripts/build-site.mjs dist _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
